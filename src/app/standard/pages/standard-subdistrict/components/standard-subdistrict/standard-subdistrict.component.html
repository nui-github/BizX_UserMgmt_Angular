  <label for="{{input.id}}" class="form-label">{{label | translate}}&nbsp;<strong class="text-danger" *ngIf="isRequired">*</strong>
    <br>
    <span class="form-label-small">{{subLabel | translate}}</span>
  </label>
  <input [attr.name]="input.id" [attr.id]="input.id"
    class="form-control" type="text"
    [placeholder]=" isCreated ? (label | translate ) + ' / ' + (subLabel | translate) : ( input.required ? 'Please' : 'Optional' + 'fill in ' + input.label + '...')"
    [ngClass]="{ 'is-invalid': control.invalid && (control.touched || control.dirty || isSubmit) , '': (!control.errors && control.value) }" [formControl]="control"
    [typeahead]="suggestionSubDistrict$" [typeaheadOptionField]="input.typeaheadOptionField" [typeaheadWaitMs]="500"
    [typeaheadAsync]="true" [typeaheadItemTemplate]="subDistrictResults" (typeaheadOnSelect)="onChange($event)"
    [typeaheadOptionsLimit]="10" (typeaheadOnBlur)="typeaheadOnBlur($event)">
<ng-template #subDistrictResults let-model="item" let-index="index">
    <div class="bg-transparent">{{model.text}}</div>
</ng-template>
@if(control.invalid && (control.touched || control.dirty || isSubmit)){
  <app-standard-error-message
    class="invalid-tooltip"
    [control]="control"
    [fieldName]="label"
    [messages]=""
  ></app-standard-error-message>
}
