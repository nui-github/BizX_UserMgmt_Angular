
  <nz-layout class="layout" id="main-wrapper" class="show-sidebar">
    <app-sidebar [sidebarTypeState]="sidebarTypeState$"></app-sidebar>
    <nz-layout class="page-wrapper">
      <app-header (toggleSidebarEvent)="eventOnToggleSideBar($event)"></app-header>
      <nz-content class="body-wrapper">
        <div class="px-4 py-3">
            <div class="row">
              <div class="col-12">
                  <nz-breadcrumb class="mb-3">
                    <nz-breadcrumb-item *ngFor="let item of breadcrumbItems; let last = last">
                      <a [routerLink]="item.url" [title]="item.title" [attr.aria-current]="last ? 'page' : null">{{ item.label }}</a>
                    </nz-breadcrumb-item>
                  </nz-breadcrumb>
              </div>
            </div>
          <router-outlet />
        </div>

      </nz-content>
      <nz-footer>
        <!-- <div class="container-fluid"> -->
          <div class="d-flex justify-content-end">
              © 2024 Netbay Public Company Limited
          </div>
        <!-- </div> -->
        </nz-footer>
    </nz-layout>
  </nz-layout>
